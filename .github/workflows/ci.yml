name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Test with the bundled CNN checkpoint
        run: python -m pytest --cov --cov-report=xml --cov-report=term --junitxml=outputs/backend-tests.xml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: backend-verification
          path: |
            outputs/backend-tests.xml
            coverage.xml
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install, test and build
        working-directory: demo_web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm test:compare
          pnpm build
